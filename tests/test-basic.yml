name: Test basic directory listing generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory structure
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-site/subdir"
          echo "Hello World" > "$GITHUB_WORKSPACE/test-site/hello.txt"
          echo "Another file" > "$GITHUB_WORKSPACE/test-site/another.txt"
          echo "Sub file" > "$GITHUB_WORKSPACE/test-site/subdir/sub.txt"

      - id: action
        uses: .
        with:
          target: test-site

      - name: Assert index.html was generated in test-site
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test-site/index.html" ]; then
            echo "FAIL: expected test-site/index.html to be generated"
            exit 1
          fi
          echo "PASS: test-site/index.html exists"

      - name: Assert index.html was generated in subdir
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test-site/subdir/index.html" ]; then
            echo "FAIL: expected test-site/subdir/index.html to be generated"
            exit 1
          fi
          echo "PASS: test-site/subdir/index.html exists"

      - name: Assert index.html contains expected files
        run: |
          content=$(cat "$GITHUB_WORKSPACE/test-site/index.html")
          echo "Content: $content"
          if ! echo "$content" | grep -q "hello.txt"; then
            echo "FAIL: index.html does not contain hello.txt"
            exit 1
          fi
          if ! echo "$content" | grep -q "another.txt"; then
            echo "FAIL: index.html does not contain another.txt"
            exit 1
          fi
          echo "PASS: index.html contains expected files"

      - name: Assert generated output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.generated }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected generated output to be non-empty"
            exit 1
          fi
          echo "PASS: generated output is non-empty"

      - name: Assert generated output contains expected paths
        env:
          ACTUAL: ${{ steps.action.outputs.generated }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "test-site"; then
            echo "FAIL: generated output does not reference test-site"
            exit 1
          fi
          echo "PASS: generated output references test-site"
