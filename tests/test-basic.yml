name: Test basic directory listing
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory structure
        run: |
          mkdir -p /tmp/test-listing/subdir
          echo "hello" > /tmp/test-listing/hello.txt
          echo "world" > /tmp/test-listing/world.txt
          echo "nested" > /tmp/test-listing/subdir/nested.txt

      - id: action
        uses: .
        with:
          target: /tmp/test-listing

      - name: Assert index.html generated in root
        run: |
          if [ ! -f "/tmp/test-listing/index.html" ]; then
            echo "FAIL: index.html not found in root target directory"
            exit 1
          fi
          echo "PASS: index.html found in root"

      - name: Assert index.html generated in subdir
        run: |
          if [ ! -f "/tmp/test-listing/subdir/index.html" ]; then
            echo "FAIL: index.html not found in subdir"
            exit 1
          fi
          echo "PASS: index.html found in subdir"

      - name: Assert index.html contains expected file links
        run: |
          CONTENT=$(cat /tmp/test-listing/index.html)
          echo "Content: $CONTENT"
          if ! echo "$CONTENT" | grep -q "hello.txt"; then
            echo "FAIL: hello.txt not listed in index.html"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "world.txt"; then
            echo "FAIL: world.txt not listed in index.html"
            exit 1
          fi
          echo "PASS: expected files listed in index.html"

      - name: Assert generated output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.generated }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected generated output to be non-empty"
            exit 1
          fi
          echo "PASS: generated output is non-empty"

      - name: Assert generated output contains expected paths
        env:
          ACTUAL: ${{ steps.action.outputs.generated }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "index.html"; then
            echo "FAIL: generated output does not contain index.html paths"
            exit 1
          fi
          echo "PASS: generated output contains index.html paths"
