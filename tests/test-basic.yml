name: Test basic directory listing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple directory structure for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-target/subdir"
          echo "hello" > "$GITHUB_WORKSPACE/test-target/hello.txt"
          echo "world" > "$GITHUB_WORKSPACE/test-target/world.txt"
          echo "nested" > "$GITHUB_WORKSPACE/test-target/subdir/nested.txt"

      - id: action
        uses: .
        with:
          target: test-target

      - name: Assert generated output is non-empty
        env:
          GENERATED: ${{ steps.action.outputs.generated }}
        run: |
          echo "generated: $GENERATED"
          if [ -z "$GENERATED" ]; then
            echo "FAIL: expected generated output to be non-empty"
            exit 1
          fi
          echo "PASS: generated output is non-empty"

      - name: Assert index.html was created in target directory
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test-target/index.html" ]; then
            echo "FAIL: expected index.html in test-target/"
            exit 1
          fi
          echo "PASS: index.html exists in test-target/"

      - name: Assert index.html was created in subdirectory
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test-target/subdir/index.html" ]; then
            echo "FAIL: expected index.html in test-target/subdir/"
            exit 1
          fi
          echo "PASS: index.html exists in test-target/subdir/"

      - name: Assert index.html contains expected file links
        run: |
          content=$(cat "$GITHUB_WORKSPACE/test-target/index.html")
          echo "index.html content:"
          echo "$content"
          if ! echo "$content" | grep -q "hello.txt"; then
            echo "FAIL: index.html does not contain hello.txt"
            exit 1
          fi
          if ! echo "$content" | grep -q "world.txt"; then
            echo "FAIL: index.html does not contain world.txt"
            exit 1
          fi
          echo "PASS: index.html contains expected file links"
