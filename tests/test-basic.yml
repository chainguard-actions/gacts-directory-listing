name: Test basic directory listing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory structure
        run: |
          mkdir -p /tmp/test-basic/subdir
          echo "hello" > /tmp/test-basic/file1.txt
          echo "world" > /tmp/test-basic/file2.txt
          echo "nested" > /tmp/test-basic/subdir/nested.txt

      - id: action
        uses: .
        with:
          target: /tmp/test-basic

      - name: Assert index.html generated in root target
        run: |
          if [ ! -f "/tmp/test-basic/index.html" ]; then
            echo "FAIL: index.html not found in /tmp/test-basic"
            exit 1
          fi
          echo "PASS: index.html found in /tmp/test-basic"

      - name: Assert index.html generated in subdirectory
        run: |
          if [ ! -f "/tmp/test-basic/subdir/index.html" ]; then
            echo "FAIL: index.html not found in /tmp/test-basic/subdir"
            exit 1
          fi
          echo "PASS: index.html found in /tmp/test-basic/subdir"

      - name: Assert index.html contains file names
        run: |
          if ! grep -q "file1.txt" /tmp/test-basic/index.html; then
            echo "FAIL: file1.txt not listed in index.html"
            cat /tmp/test-basic/index.html
            exit 1
          fi
          if ! grep -q "file2.txt" /tmp/test-basic/index.html; then
            echo "FAIL: file2.txt not listed in index.html"
            cat /tmp/test-basic/index.html
            exit 1
          fi
          echo "PASS: files listed in index.html"

      - name: Assert generated output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.generated }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: generated output is empty"
            exit 1
          fi
          echo "PASS: generated output is non-empty"
