name: Test basic directory listing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory structure
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-target/subdir"
          echo "hello" > "$GITHUB_WORKSPACE/test-target/file1.txt"
          echo "world" > "$GITHUB_WORKSPACE/test-target/file2.txt"
          echo "nested" > "$GITHUB_WORKSPACE/test-target/subdir/nested.txt"

      - id: action
        uses: .
        with:
          target: test-target

      - name: Assert generated output is non-empty
        env:
          GENERATED: ${{ steps.action.outputs.generated }}
        run: |
          echo "generated: $GENERATED"
          if [ -z "$GENERATED" ]; then
            echo "FAIL: expected generated output to be non-empty"
            exit 1
          fi
          echo "PASS: generated output is non-empty"

      - name: Assert index.html was created in target root
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test-target/index.html" ]; then
            echo "FAIL: expected index.html in test-target/"
            exit 1
          fi
          echo "PASS: index.html exists in test-target/"

      - name: Assert index.html was created in subdir
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test-target/subdir/index.html" ]; then
            echo "FAIL: expected index.html in test-target/subdir/"
            exit 1
          fi
          echo "PASS: index.html exists in test-target/subdir/"

      - name: Assert index.html contains file references
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/test-target/index.html")
          echo "index.html content: $CONTENT"
          if ! echo "$CONTENT" | grep -q "file1.txt"; then
            echo "FAIL: index.html does not reference file1.txt"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "file2.txt"; then
            echo "FAIL: index.html does not reference file2.txt"
            exit 1
          fi
          echo "PASS: index.html contains expected file references"
