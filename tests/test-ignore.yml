name: Test ignore patterns
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory structure with files to ignore
        run: |
          mkdir -p /tmp/test-ignore/logs
          echo "keep me" > /tmp/test-ignore/keep.txt
          echo "ignore me" > /tmp/test-ignore/secret.log
          echo "log entry" > /tmp/test-ignore/logs/app.log

      - id: action
        uses: .
        with:
          target: /tmp/test-ignore
          ignore: '**/index.html,**/*.log,logs/**'

      - name: Assert generated output is set
        env:
          ACTUAL: ${{ steps.action.outputs.generated }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected 'generated' output to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert index.html was created
        run: |
          if [ ! -f /tmp/test-ignore/index.html ]; then
            echo "FAIL: expected /tmp/test-ignore/index.html to exist"
            exit 1
          fi
          echo "PASS: index.html exists"
          cat /tmp/test-ignore/index.html

      - name: Assert ignored .log file is not listed
        run: |
          if grep -q "secret.log" /tmp/test-ignore/index.html; then
            echo "FAIL: index.html should not contain 'secret.log'"
            exit 1
          fi
          echo "PASS: secret.log is not listed"

      - name: Assert kept file is listed
        run: |
          if ! grep -q "keep.txt" /tmp/test-ignore/index.html; then
            echo "FAIL: index.html should contain 'keep.txt'"
            exit 1
          fi
          echo "PASS: keep.txt is listed"
