name: Test ignore patterns
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory structure
        run: |
          mkdir -p /tmp/test-ignore/included
          mkdir -p /tmp/test-ignore/excluded
          echo "file1" > /tmp/test-ignore/file1.txt
          echo "file2" > /tmp/test-ignore/included/file2.txt
          echo "secret" > /tmp/test-ignore/excluded/secret.txt

      - id: action
        uses: .
        with:
          target: /tmp/test-ignore
          ignore: '**/index.html,**/excluded/**'

      - name: Assert index.html was generated at root
        run: |
          if [ ! -f "/tmp/test-ignore/index.html" ]; then
            echo "FAIL: expected /tmp/test-ignore/index.html to exist"
            exit 1
          fi
          echo "PASS: root index.html exists"

      - name: Assert index.html was generated in included subdir
        run: |
          if [ ! -f "/tmp/test-ignore/included/index.html" ]; then
            echo "FAIL: expected /tmp/test-ignore/included/index.html to exist"
            exit 1
          fi
          echo "PASS: included/index.html exists"

      - name: Assert index.html was NOT generated in excluded subdir
        run: |
          if [ -f "/tmp/test-ignore/excluded/index.html" ]; then
            echo "FAIL: /tmp/test-ignore/excluded/index.html should not exist"
            exit 1
          fi
          echo "PASS: excluded/index.html correctly absent"

      - name: Assert excluded directory is not listed in root index.html
        run: |
          if grep -q "secret.txt" /tmp/test-ignore/index.html; then
            echo "FAIL: secret.txt should not appear in root index.html"
            cat /tmp/test-ignore/index.html
            exit 1
          fi
          echo "PASS: secret.txt not found in root index.html"
