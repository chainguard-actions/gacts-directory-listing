name: Test show hidden files
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory structure with hidden files
        run: |
          mkdir -p /tmp/test-hidden
          echo "visible" > /tmp/test-hidden/visible.txt
          echo "hidden" > /tmp/test-hidden/.hidden-file.txt
          mkdir -p /tmp/test-hidden/.hidden-dir
          echo "in hidden dir" > /tmp/test-hidden/.hidden-dir/file.txt

      - id: action
        uses: .
        with:
          target: /tmp/test-hidden
          show-hidden: 'true'

      - name: Assert index.html generated
        run: |
          if [ ! -f "/tmp/test-hidden/index.html" ]; then
            echo "FAIL: index.html not found"
            exit 1
          fi
          echo "PASS: index.html found"

      - name: Assert hidden file is listed when show-hidden is true
        run: |
          CONTENT=$(cat /tmp/test-hidden/index.html)
          echo "Content: $CONTENT"
          if ! echo "$CONTENT" | grep -q ".hidden-file.txt"; then
            echo "FAIL: .hidden-file.txt should be listed when show-hidden=true"
            exit 1
          fi
          echo "PASS: .hidden-file.txt correctly listed"

      - name: Assert hidden directory is listed when show-hidden is true
        run: |
          CONTENT=$(cat /tmp/test-hidden/index.html)
          echo "Content: $CONTENT"
          if ! echo "$CONTENT" | grep -q ".hidden-dir"; then
            echo "FAIL: .hidden-dir should be listed when show-hidden=true"
            exit 1
          fi
          echo "PASS: .hidden-dir correctly listed"

      - name: Assert generated output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.generated }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected generated output to be non-empty"
            exit 1
          fi
          echo "PASS: generated output is non-empty"
