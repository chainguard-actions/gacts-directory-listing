name: Test show hidden files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create directory structure with hidden files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-hidden"
          echo "visible" > "$GITHUB_WORKSPACE/test-hidden/visible.txt"
          echo "hidden" > "$GITHUB_WORKSPACE/test-hidden/.hidden-file.txt"
          mkdir -p "$GITHUB_WORKSPACE/test-hidden/.hidden-dir"
          echo "in hidden dir" > "$GITHUB_WORKSPACE/test-hidden/.hidden-dir/file.txt"

      - id: action
        uses: .
        with:
          target: test-hidden
          show-hidden: 'true'

      - name: Assert generated output is non-empty
        env:
          GENERATED: ${{ steps.action.outputs.generated }}
        run: |
          echo "generated: $GENERATED"
          if [ -z "$GENERATED" ]; then
            echo "FAIL: expected generated output to be non-empty"
            exit 1
          fi
          echo "PASS: generated output is non-empty"

      - name: Assert index.html was created in target directory
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test-hidden/index.html" ]; then
            echo "FAIL: expected index.html in test-hidden/"
            exit 1
          fi
          echo "PASS: index.html exists in test-hidden/"

      - name: Assert hidden file is listed in index.html
        run: |
          content=$(cat "$GITHUB_WORKSPACE/test-hidden/index.html")
          echo "index.html content:"
          echo "$content"
          if ! echo "$content" | grep -q ".hidden-file.txt"; then
            echo "FAIL: index.html should contain .hidden-file.txt when show-hidden=true"
            exit 1
          fi
          echo "PASS: hidden file is listed in index.html"

      - name: Assert visible file is also listed in index.html
        run: |
          content=$(cat "$GITHUB_WORKSPACE/test-hidden/index.html")
          if ! echo "$content" | grep -q "visible.txt"; then
            echo "FAIL: index.html should contain visible.txt"
            exit 1
          fi
          echo "PASS: visible.txt is listed in index.html"
