name: Test show-hidden option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory with hidden files
        run: |
          mkdir -p /tmp/test-hidden
          echo "visible" > /tmp/test-hidden/visible.txt
          echo "hidden" > /tmp/test-hidden/.hidden-file
          mkdir -p /tmp/test-hidden/.hidden-dir
          echo "inside hidden dir" > /tmp/test-hidden/.hidden-dir/file.txt

      - id: action
        uses: .
        with:
          target: /tmp/test-hidden
          show-hidden: 'true'

      - name: Assert generated output is set
        env:
          ACTUAL: ${{ steps.action.outputs.generated }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected 'generated' output to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert index.html was created
        run: |
          if [ ! -f /tmp/test-hidden/index.html ]; then
            echo "FAIL: expected /tmp/test-hidden/index.html to exist"
            exit 1
          fi
          echo "PASS: index.html exists"
          cat /tmp/test-hidden/index.html

      - name: Assert hidden file is listed
        run: |
          if ! grep -q ".hidden-file" /tmp/test-hidden/index.html; then
            echo "FAIL: index.html should contain '.hidden-file' when show-hidden is true"
            exit 1
          fi
          echo "PASS: .hidden-file is listed"

      - name: Assert visible file is also listed
        run: |
          if ! grep -q "visible.txt" /tmp/test-hidden/index.html; then
            echo "FAIL: index.html should contain 'visible.txt'"
            exit 1
          fi
          echo "PASS: visible.txt is listed"
