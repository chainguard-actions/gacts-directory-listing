name: Test show-hidden input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory with hidden files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-hidden"
          echo "Visible file" > "$GITHUB_WORKSPACE/test-hidden/visible.txt"
          echo "Hidden file" > "$GITHUB_WORKSPACE/test-hidden/.hidden.txt"

      - id: action
        uses: .
        with:
          target: test-hidden
          show-hidden: 'true'

      - name: Assert index.html was generated
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test-hidden/index.html" ]; then
            echo "FAIL: expected test-hidden/index.html to be generated"
            exit 1
          fi
          echo "PASS: test-hidden/index.html exists"

      - name: Assert index.html contains hidden file
        run: |
          content=$(cat "$GITHUB_WORKSPACE/test-hidden/index.html")
          echo "Content: $content"
          if ! echo "$content" | grep -q ".hidden.txt"; then
            echo "FAIL: index.html does not contain .hidden.txt"
            exit 1
          fi
          echo "PASS: index.html contains hidden file"

      - name: Assert index.html contains visible file
        run: |
          content=$(cat "$GITHUB_WORKSPACE/test-hidden/index.html")
          if ! echo "$content" | grep -q "visible.txt"; then
            echo "FAIL: index.html does not contain visible.txt"
            exit 1
          fi
          echo "PASS: index.html contains visible file"
