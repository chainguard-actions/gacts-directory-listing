name: Test overwrite existing index.html
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory with existing index.html
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-overwrite"
          echo "file content" > "$GITHUB_WORKSPACE/test-overwrite/file.txt"
          echo "ORIGINAL CONTENT - DO NOT OVERWRITE" > "$GITHUB_WORKSPACE/test-overwrite/index.html"

      - name: Run action without overwrite (default false)
        id: action-no-overwrite
        uses: .
        with:
          target: test-overwrite
          overwrite: 'false'

      - name: Assert existing index.html was NOT overwritten
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/test-overwrite/index.html")
          echo "index.html content: $CONTENT"
          if ! echo "$CONTENT" | grep -q "ORIGINAL CONTENT"; then
            echo "FAIL: existing index.html should not be overwritten when overwrite=false"
            exit 1
          fi
          echo "PASS: existing index.html was preserved"

      - name: Run action with overwrite=true
        id: action-overwrite
        uses: .
        with:
          target: test-overwrite
          overwrite: 'true'

      - name: Assert generated output is non-empty after overwrite
        env:
          GENERATED: ${{ steps.action-overwrite.outputs.generated }}
        run: |
          echo "generated: $GENERATED"
          if [ -z "$GENERATED" ]; then
            echo "FAIL: expected generated output to be non-empty"
            exit 1
          fi
          echo "PASS: generated output is non-empty"

      - name: Assert index.html was overwritten
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/test-overwrite/index.html")
          echo "index.html content: $CONTENT"
          if echo "$CONTENT" | grep -q "ORIGINAL CONTENT - DO NOT OVERWRITE"; then
            echo "FAIL: index.html should have been overwritten when overwrite=true"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "file.txt"; then
            echo "FAIL: new index.html should reference file.txt"
            exit 1
          fi
          echo "PASS: index.html was overwritten with new content"
