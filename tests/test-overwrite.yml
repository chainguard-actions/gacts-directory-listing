name: Test overwrite behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory
        run: |
          mkdir -p /tmp/test-overwrite
          echo "file content" > /tmp/test-overwrite/file.txt
          # Pre-create an index.html with a sentinel value
          echo "ORIGINAL_SENTINEL_CONTENT" > /tmp/test-overwrite/index.html

      - id: action-no-overwrite
        uses: .
        with:
          target: /tmp/test-overwrite
          overwrite: 'false'

      - name: Assert original index.html was NOT overwritten
        run: |
          if ! grep -q "ORIGINAL_SENTINEL_CONTENT" /tmp/test-overwrite/index.html; then
            echo "FAIL: index.html was overwritten when overwrite=false"
            cat /tmp/test-overwrite/index.html
            exit 1
          fi
          echo "PASS: original index.html preserved when overwrite=false"

      - name: Assert generated output is empty (skipped)
        env:
          ACTUAL: ${{ steps.action-no-overwrite.outputs.generated }}
        run: |
          echo "actual: $ACTUAL"
          # When overwrite=false and index.html already exists, it should be skipped (empty generated list)
          if [ "$ACTUAL" != "[]" ] && [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty generated list but got: $ACTUAL"
            exit 1
          fi
          echo "PASS: generated output is empty as expected (file was skipped)"

      - id: action-with-overwrite
        uses: .
        with:
          target: /tmp/test-overwrite
          overwrite: 'true'

      - name: Assert index.html was overwritten
        run: |
          if grep -q "ORIGINAL_SENTINEL_CONTENT" /tmp/test-overwrite/index.html; then
            echo "FAIL: index.html was NOT overwritten when overwrite=true"
            exit 1
          fi
          echo "PASS: index.html was overwritten when overwrite=true"

      - name: Assert generated output is non-empty after overwrite
        env:
          ACTUAL: ${{ steps.action-with-overwrite.outputs.generated }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" = "[]" ]; then
            echo "FAIL: expected non-empty generated list after overwrite"
            exit 1
          fi
          echo "PASS: generated output is non-empty after overwrite"
