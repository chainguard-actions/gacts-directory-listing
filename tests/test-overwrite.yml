name: Test overwrite behavior
on:
  workflow_dispatch:

jobs:
  test-no-overwrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory with existing index.html
        run: |
          mkdir -p /tmp/test-overwrite
          echo "file content" > /tmp/test-overwrite/file.txt
          echo "ORIGINAL CONTENT" > /tmp/test-overwrite/index.html

      - id: action-no-overwrite
        uses: .
        with:
          target: /tmp/test-overwrite
          overwrite: 'false'

      - name: Assert existing index.html was NOT overwritten
        run: |
          CONTENT=$(cat /tmp/test-overwrite/index.html)
          echo "Content: $CONTENT"
          if ! echo "$CONTENT" | grep -q "ORIGINAL CONTENT"; then
            echo "FAIL: index.html was overwritten but overwrite=false"
            exit 1
          fi
          echo "PASS: index.html was not overwritten"

      - name: Assert generated output is empty (nothing was generated)
        env:
          ACTUAL: ${{ steps.action-no-overwrite.outputs.generated }}
        run: |
          echo "actual: $ACTUAL"
          # When overwrite=false and index.html already exists, nothing should be generated
          # The output should be empty or an empty array
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "[]" ]; then
            echo "PASS: generated output is empty as expected (file was skipped)"
          else
            echo "INFO: generated output: $ACTUAL (may have generated for other dirs)"
          fi

  test-with-overwrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory with existing index.html
        run: |
          mkdir -p /tmp/test-overwrite2
          echo "file content" > /tmp/test-overwrite2/file.txt
          echo "ORIGINAL CONTENT" > /tmp/test-overwrite2/index.html

      - id: action-overwrite
        uses: .
        with:
          target: /tmp/test-overwrite2
          overwrite: 'true'

      - name: Assert existing index.html WAS overwritten
        run: |
          CONTENT=$(cat /tmp/test-overwrite2/index.html)
          echo "Content: $CONTENT"
          if echo "$CONTENT" | grep -q "ORIGINAL CONTENT"; then
            echo "FAIL: index.html was not overwritten but overwrite=true"
            exit 1
          fi
          echo "PASS: index.html was overwritten"

      - name: Assert generated output is non-empty
        env:
          ACTUAL: ${{ steps.action-overwrite.outputs.generated }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected generated output to be non-empty when overwrite=true"
            exit 1
          fi
          echo "PASS: generated output is non-empty"
