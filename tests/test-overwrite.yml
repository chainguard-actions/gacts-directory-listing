name: Test overwrite existing index.html
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create directory structure with existing index.html
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-overwrite"
          echo "file1" > "$GITHUB_WORKSPACE/test-overwrite/file1.txt"
          echo "file2" > "$GITHUB_WORKSPACE/test-overwrite/file2.txt"
          # Create an existing index.html that SHOULD be overwritten
          echo "<html><body>OLD CONTENT THAT SHOULD BE REPLACED</body></html>" > "$GITHUB_WORKSPACE/test-overwrite/index.html"

      - id: action
        uses: .
        with:
          target: test-overwrite
          overwrite: 'true'

      - name: Assert existing index.html was overwritten
        run: |
          content=$(cat "$GITHUB_WORKSPACE/test-overwrite/index.html")
          echo "index.html content:"
          echo "$content"
          if echo "$content" | grep -q "OLD CONTENT THAT SHOULD BE REPLACED"; then
            echo "FAIL: existing index.html was not overwritten when overwrite=true"
            exit 1
          fi
          echo "PASS: existing index.html was overwritten"

      - name: Assert new index.html contains expected files
        run: |
          content=$(cat "$GITHUB_WORKSPACE/test-overwrite/index.html")
          if ! echo "$content" | grep -q "file1.txt"; then
            echo "FAIL: new index.html should contain file1.txt"
            exit 1
          fi
          if ! echo "$content" | grep -q "file2.txt"; then
            echo "FAIL: new index.html should contain file2.txt"
            exit 1
          fi
          echo "PASS: new index.html contains expected files"
