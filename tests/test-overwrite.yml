name: Test overwrite behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory with existing index.html
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-overwrite"
          echo "Existing content" > "$GITHUB_WORKSPACE/test-overwrite/file.txt"
          echo "ORIGINAL INDEX" > "$GITHUB_WORKSPACE/test-overwrite/index.html"

      - name: Run action without overwrite (default)
        id: action-no-overwrite
        uses: .
        with:
          target: test-overwrite
          overwrite: 'false'

      - name: Assert existing index.html was NOT overwritten
        run: |
          content=$(cat "$GITHUB_WORKSPACE/test-overwrite/index.html")
          echo "Content: $content"
          if ! echo "$content" | grep -q "ORIGINAL INDEX"; then
            echo "FAIL: index.html should still contain original content (not overwritten)"
            exit 1
          fi
          echo "PASS: index.html was not overwritten"

      - name: Assert generated output is empty (nothing was generated)
        env:
          ACTUAL: ${{ steps.action-no-overwrite.outputs.generated }}
        run: |
          echo "actual: $ACTUAL"
          # When overwrite=false and index.html already exists, nothing is generated
          # The output should be empty or an empty array
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "[]" ]; then
            echo "PASS: generated output is empty as expected (file was skipped)"
          else
            echo "INFO: generated output: $ACTUAL (may include other dirs)"
          fi

      - name: Run action with overwrite enabled
        id: action-overwrite
        uses: .
        with:
          target: test-overwrite
          overwrite: 'true'

      - name: Assert index.html was overwritten with generated content
        run: |
          content=$(cat "$GITHUB_WORKSPACE/test-overwrite/index.html")
          echo "Content: $content"
          if echo "$content" | grep -q "ORIGINAL INDEX"; then
            echo "FAIL: index.html should have been overwritten (still contains original content)"
            exit 1
          fi
          if ! echo "$content" | grep -q "file.txt"; then
            echo "FAIL: overwritten index.html should contain file.txt"
            exit 1
          fi
          echo "PASS: index.html was overwritten with generated content"

      - name: Assert generated output is non-empty after overwrite
        env:
          ACTUAL: ${{ steps.action-overwrite.outputs.generated }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected generated output to be non-empty after overwrite"
            exit 1
          fi
          echo "PASS: generated output is non-empty"
