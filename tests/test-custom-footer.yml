name: Test custom footer
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-footer"
          echo "Some content" > "$GITHUB_WORKSPACE/test-footer/readme.txt"

      - id: action
        uses: .
        with:
          target: test-footer
          footer: 'My Custom Footer Text'

      - name: Assert index.html was generated
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test-footer/index.html" ]; then
            echo "FAIL: expected test-footer/index.html to be generated"
            exit 1
          fi
          echo "PASS: test-footer/index.html exists"

      - name: Assert index.html contains custom footer
        run: |
          content=$(cat "$GITHUB_WORKSPACE/test-footer/index.html")
          echo "Content: $content"
          if ! echo "$content" | grep -q "My Custom Footer Text"; then
            echo "FAIL: index.html does not contain custom footer text"
            exit 1
          fi
          echo "PASS: index.html contains custom footer"

      - name: Assert generated output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.generated }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected generated output to be non-empty"
            exit 1
          fi
          echo "PASS: generated output is non-empty"
