name: Test custom footer
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory
        run: |
          mkdir -p /tmp/test-footer
          echo "content" > /tmp/test-footer/file.txt

      - id: action
        uses: .
        with:
          target: /tmp/test-footer
          footer: 'My Custom Footer Text 12345'

      - name: Assert index.html was created
        run: |
          if [ ! -f "/tmp/test-footer/index.html" ]; then
            echo "FAIL: expected /tmp/test-footer/index.html to exist"
            exit 1
          fi
          echo "PASS"

      - name: Assert custom footer appears in index.html
        run: |
          content=$(cat /tmp/test-footer/index.html)
          echo "index.html content:"
          echo "$content"
          if ! echo "$content" | grep -q "My Custom Footer Text 12345"; then
            echo "FAIL: expected custom footer 'My Custom Footer Text 12345' to appear in index.html"
            exit 1
          fi
          echo "PASS"

      - name: Assert generated output is non-empty
        env:
          GENERATED: ${{ steps.action.outputs.generated }}
        run: |
          echo "generated: $GENERATED"
          if [ -z "$GENERATED" ]; then
            echo "FAIL: expected generated output to be non-empty"
            exit 1
          fi
          echo "PASS"
