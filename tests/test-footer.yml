name: Test custom footer
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory structure
        run: |
          mkdir -p /tmp/test-footer
          echo "hello" > /tmp/test-footer/file1.txt

      - id: action
        uses: .
        with:
          target: /tmp/test-footer
          footer: 'My Custom Footer Text 2024'

      - name: Assert index.html was created
        run: |
          if [ ! -f "/tmp/test-footer/index.html" ]; then
            echo "FAIL: expected /tmp/test-footer/index.html to exist"
            exit 1
          fi
          echo "PASS"

      - name: Assert custom footer appears in index.html
        run: |
          if ! grep -q "My Custom Footer Text 2024" /tmp/test-footer/index.html; then
            echo "FAIL: expected custom footer text in index.html"
            cat /tmp/test-footer/index.html
            exit 1
          fi
          echo "PASS"
