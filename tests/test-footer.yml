name: Test custom footer
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory
        run: |
          mkdir -p /tmp/test-footer
          echo "some content" > /tmp/test-footer/readme.txt

      - id: action
        uses: .
        with:
          target: /tmp/test-footer
          footer: 'My Custom Footer Text 12345'

      - name: Assert index.html was generated
        run: |
          if [ ! -f "/tmp/test-footer/index.html" ]; then
            echo "FAIL: index.html not found in /tmp/test-footer"
            exit 1
          fi
          echo "PASS: index.html found"

      - name: Assert custom footer appears in index.html
        run: |
          if ! grep -q "My Custom Footer Text 12345" /tmp/test-footer/index.html; then
            echo "FAIL: custom footer not found in index.html"
            cat /tmp/test-footer/index.html
            exit 1
          fi
          echo "PASS: custom footer found in index.html"

      - name: Assert generated output contains the path
        env:
          ACTUAL: ${{ steps.action.outputs.generated }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" = "[]" ]; then
            echo "FAIL: generated output is empty"
            exit 1
          fi
          echo "PASS: generated output is non-empty"
