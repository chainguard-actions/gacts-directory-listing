name: Test ignore patterns
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create directory structure with files to ignore
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-ignore/logs"
          mkdir -p "$GITHUB_WORKSPACE/test-ignore/data"
          echo "keep me" > "$GITHUB_WORKSPACE/test-ignore/keep.txt"
          echo "ignore me" > "$GITHUB_WORKSPACE/test-ignore/ignore.log"
          echo "also ignore" > "$GITHUB_WORKSPACE/test-ignore/logs/app.log"
          echo "keep nested" > "$GITHUB_WORKSPACE/test-ignore/data/data.csv"

      - id: action
        uses: .
        with:
          target: test-ignore
          ignore: "**/*.log,logs/**"

      - name: Assert generated output is non-empty
        env:
          GENERATED: ${{ steps.action.outputs.generated }}
        run: |
          echo "generated: $GENERATED"
          if [ -z "$GENERATED" ]; then
            echo "FAIL: expected generated output to be non-empty"
            exit 1
          fi
          echo "PASS: generated output is non-empty"

      - name: Assert index.html was created in target directory
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test-ignore/index.html" ]; then
            echo "FAIL: expected index.html in test-ignore/"
            exit 1
          fi
          echo "PASS: index.html exists in test-ignore/"

      - name: Assert ignored .log file is not listed in index.html
        run: |
          content=$(cat "$GITHUB_WORKSPACE/test-ignore/index.html")
          echo "index.html content:"
          echo "$content"
          if echo "$content" | grep -q "ignore.log"; then
            echo "FAIL: index.html should not contain ignored file ignore.log"
            exit 1
          fi
          echo "PASS: ignored .log file is not listed"

      - name: Assert kept file is listed in index.html
        run: |
          content=$(cat "$GITHUB_WORKSPACE/test-ignore/index.html")
          if ! echo "$content" | grep -q "keep.txt"; then
            echo "FAIL: index.html should contain keep.txt"
            exit 1
          fi
          echo "PASS: keep.txt is listed in index.html"

      - name: Assert ignored logs directory has no index.html
        run: |
          if [ -f "$GITHUB_WORKSPACE/test-ignore/logs/index.html" ]; then
            echo "FAIL: index.html should not be generated for ignored logs/ directory"
            exit 1
          fi
          echo "PASS: no index.html in ignored logs/ directory"
