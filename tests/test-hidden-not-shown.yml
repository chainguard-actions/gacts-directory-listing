name: Test hidden files not shown by default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test directory structure with hidden files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-no-hidden"
          echo "visible" > "$GITHUB_WORKSPACE/test-no-hidden/visible.txt"
          echo "hidden" > "$GITHUB_WORKSPACE/test-no-hidden/.hidden-file"

      - id: action
        uses: .
        with:
          target: test-no-hidden
          show-hidden: 'false'

      - name: Assert generated output is non-empty
        env:
          GENERATED: ${{ steps.action.outputs.generated }}
        run: |
          echo "generated: $GENERATED"
          if [ -z "$GENERATED" ]; then
            echo "FAIL: expected generated output to be non-empty"
            exit 1
          fi
          echo "PASS: generated output is non-empty"

      - name: Assert index.html was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test-no-hidden/index.html" ]; then
            echo "FAIL: expected index.html in test-no-hidden/"
            exit 1
          fi
          echo "PASS: index.html exists"

      - name: Assert hidden file is NOT listed in index
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/test-no-hidden/index.html")
          echo "index.html content: $CONTENT"
          if echo "$CONTENT" | grep -q '\.hidden-file'; then
            echo "FAIL: index.html should NOT list .hidden-file when show-hidden=false"
            exit 1
          fi
          echo "PASS: .hidden-file is not listed in index.html"

      - name: Assert visible file is listed
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/test-no-hidden/index.html")
          if ! echo "$CONTENT" | grep -q "visible.txt"; then
            echo "FAIL: index.html should list visible.txt"
            exit 1
          fi
          echo "PASS: visible.txt is listed in index.html"
